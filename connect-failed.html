<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plate: link didn't work</title>
<style>
  :root { --bg:#f6f1e9; --card:#fffdf9; --ink:#1f1b16; --muted:#6f675d; --accent:#d4452f; --line:#e6dfd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --card:#1f1c19; --ink:#f4efe7; --muted:#a59d91; --accent:#ee7a5e; --line:#2f2b26; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:0 20px; }
  nav { padding:22px 0; display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--accent); display:inline-block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:36px 28px; margin:40px auto 0; max-width:420px; text-align:center; }
  .icon { width:56px; height:56px; border-radius:50%; background:var(--accent); margin:0 auto 18px; display:flex; align-items:center; justify-content:center; }
  .icon svg { width:28px; height:28px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-size:28px; line-height:1.15; margin:0 0 10px; letter-spacing:-0.02em; }
  p { color:var(--muted); margin:0; font-size:18px; }
  footer { margin:40px 0; text-align:center; font-size:14px; color:var(--muted); }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav><span class="dot"></span> Plate</nav>
  <main class="card">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></div>
    <h1>That link didn't work.</h1>
    <p>Text 'connect my calendar' to get a new one.</p>
  </main>
  <footer><a href="./">plate</a></footer>
</div>
</body>
</html>
